# Link-preview bots build their card from the og:/twitter: tags in raw HTML
# and none of them run JavaScript, so the viewer -- which sets those tags from
# JS only -- previews every term as the site logo. These user-agents get
# VFBquery's rendered preview instead; everyone else keeps the redirect below.
map $http_user_agent $vfb_unfurler {
    default 0;
    "~*(Slackbot|Twitterbot|facebookexternalhit|facebookcatalog|LinkedInBot|Discordbot|TelegramBot|WhatsApp|SkypeUriPreview|Mastodon|Pleroma|cardyb|redditbot|Iframely|Embedly|vkShare|Google-PageRenderer|Bingbot-Preview)" 1;
}

server {
    listen       80;
    server_name  localhost;
   
    resolver 169.254.169.250 valid=30s ipv6=off;   # Rancher DNS, as owl_cache uses
    rewrite_log on;
    
    # Unfurlers only, and only for a bare term id -- /reports/<id>/thumbnail...
    # still falls through to the data-server rewrite below. `rewrite ... last`
    # is used rather than proxy_pass because proxy_pass inside `if` is unsafe.
    #
    # The id charset is deliberately broad, matching VFBquery's own: underscored
    # ontology ids (FBbt_00003748, VFB_jrchjrch) sit alongside FlyBase ids with
    # no underscore (FBgn0038978, FBtp0106402) and dataset names (Court2017).
    # Requiring an underscore, as this once did, silently denied a preview to
    # every FlyBase id and every dataset. An id with no term behind it is a 404
    # upstream and falls back to the redirect below, so over-matching is cheap.
    # The trailing anchor keeps /reports/<id>/thumbnail.png on the rule after it,
    # and the charset excludes the label-style URLs FlyBase points here.
    if ($vfb_unfurler) {
        rewrite ^/reports/([A-Za-z][A-Za-z0-9_]+)/?$ /_preview/$1 last;
    }

    rewrite ^/reports/(VFB)_([0-9][0-9][0-9][0-9])([0-9][0-9][0-9][0-9])(/(thumbnail|volume|source).*) https://www.virtualflybrain.org/data/$1/c/$2/$3$4 last;
    rewrite ^/reports/(.*)([0-9]*) https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?id=$1$2 last;
    rewrite ^/do/ont_bean\.html https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?$args last;
    rewrite ^/do/gene_list\.html https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?$args last;
    rewrite ^/do/cluster_list\.html https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?$args last;
    rewrite ^/do/individual_list\.html https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?$args last;
    rewrite ^/do/ont_bean_list\.html https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?$args last;
    rewrite ^/do/.*html https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?$args last;
    rewrite ^/site/vfb_site/faq\.htm https://groups.google.com/forum/embed/?place=forum/vfb-suport#!forum/vfb-suport last;
    rewrite ^/site/vfb_site/.* https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto last;
    rewrite ^/site/stacks/index\.htm https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?$args last;
    rewrite ^/site/stacks/index\.htm https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto last;
    rewrite ^/site/vfb_site/home\.htm https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto last;
    rewrite ^/data/(.*)([0-9]*) https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?id=$1$2 last;
    rewrite ^/site/(.*)([0-9]*) https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?id=$1$2 last;
    rewrite ^/config/neo4j2owl-config.yaml http://raw.githubusercontent.com/VirtualFlyBrain/vfb-prod/master/neo4j2owl-config.yaml last;
    
    # Served only via the rewrite above. Upstream is plain HTTP through the
    # public name, as owl_cache does it, so there is no SNI or cert handling
    # here; v3-cached fronts VFBquery and caches the response.
    location ^~ /_preview/ {
        internal;
        set $vfb_id $1;
        proxy_pass http://v3-cached.virtualflybrain.org/get_preview?id=$vfb_id;
        proxy_set_header Host v3-cached.virtualflybrain.org;

        # An unfurler gives up in a few seconds, so a slow or unhappy upstream
        # must fall back to the ordinary redirect rather than show an error.
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @viewer;
    }

    location @viewer {
        return 302 https://v2.virtualflybrain.org/org.geppetto.frontend/geppetto?id=$vfb_id;
    }

    set $my_host $host;
    if ($uri = "/org.geppetto.frontend/geppetto") {
        set $my_host "v2.virtualflybrain.org";
    }
    if ($host = "larva.virtualflybrain.org") {
        set $my_host "larval.virtualflybrain.org";
    }
    if ($host = "www.virtualflybrain.org") {
        set $my_host "v2.virtualflybrain.org";
    }
    if ($host = "virtualflybrain.org") {
        set $my_host "v2.virtualflybrain.org";
    }
    return https://$my_host$uri$is_args$args;


}

server {
    listen  8081;
    server_name larva.virtualflybrain.org;
    return 301 https://larval.virtualflybrain.org$request_uri;
}
